    function formatMoney(amountIDR) {
      if (appState.hideNominal) {
        return "••••••••";
      }
      const rate = appState.currencyRates[appState.activeCurrency] || 1;
      const symbol = appState.currencySymbols[appState.activeCurrency] || "Rp ";
      const converted = (amountIDR || 0) * rate;

      if (appState.activeCurrency === "IDR") {
        return symbol + Math.round(converted).toLocaleString("id-ID");
      } else {
        return symbol + converted.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }
    }

    function t(key) {
      const l = appState.lang || "id";
      return (i18n[l] && i18n[l][key]) ? i18n[l][key] : key;
    }

    function showToast(msg, type = "info") {
      const container = document.getElementById("toast-container");
      if (!container) return;
      const toast = document.createElement("div");
      const bg = type === "success" ? "bg-emerald-500" : type === "error" ? "bg-rose-500" : "bg-brand-500";
      toast.className = `${bg} text-white text-xs font-semibold py-2.5 px-4 rounded-2xl shadow-xl flex items-center gap-2 transform transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto`;
      toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-exclamation' : 'fa-bell'}"></i> <span>${msg}</span>`;
      container.appendChild(toast);

      setTimeout(() => toast.classList.remove("translate-y-2", "opacity-0"), 10);
      setTimeout(() => {
        toast.classList.add("opacity-0", "translate-y-2");
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    let confirmCallback = null;
    function showConfirmModal(title, msg, onConfirm) {
      document.getElementById("confirm-modal-title").innerText = title;
      document.getElementById("confirm-modal-msg").innerText = msg;
      confirmCallback = onConfirm;
      document.getElementById("confirm-modal").classList.remove("hidden");
    }

    function closeConfirmModal(accepted) {
      document.getElementById("confirm-modal").classList.add("hidden");
      if (accepted && typeof confirmCallback === "function") {

    /* ==========================================================================
       5. KALKULASI FINANSIAL & PENURUNAN LEVEL PET OTOMATIS
       ========================================================================== */
    function getFinancialMetrics() {
      let totalIncome = 0;
      let totalExpense = 0;
      const expenseByCategory = {};
      const walletBalances = {};

      appState.transactions.forEach(tx => {
        const val = Number(tx.amount) || 0;
        if (!walletBalances[tx.wallet]) walletBalances[tx.wallet] = 0;

        if (tx.type === "income") {
          totalIncome += val;
          walletBalances[tx.wallet] += val;
        } else {
          totalExpense += val;
          walletBalances[tx.wallet] -= val;
          expenseByCategory[tx.category] = (expenseByCategory[tx.category] || 0) + val;
        }
      });

      const currentBalance = totalIncome - totalExpense;
      const savingsRate = totalIncome > 0 ? Math.round(((totalIncome - totalExpense) / totalIncome) * 100) : 0;

      return { totalIncome, totalExpense, currentBalance, expenseByCategory, savingsRate, walletBalances };
    }

    // Evaluasi aktivitas pengguna setiap aplikasi dibuka (Level turun jika tidak rajin)
    function evaluatePetActivity() {
      if (!appState.currentUser) return;
      const today = new Date().toISOString().split("T")[0];
      const lastActive = appState.pet.lastActiveDate || today;

      const d1 = new Date(today);
      const d2 = new Date(lastActive);
      const diffTime = Math.abs(d1 - d2);
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      // Jika tidak aktif lebih dari 1 hari, kurangi level dan ubah mood pet menjadi lesu
      if (diffDays > 1) {
        const levelPenalty = diffDays - 1;
        appState.pet.level = Math.max(1, appState.pet.level - levelPenalty);
        appState.pet.xp = 0;
        appState.challenge.streak = 0;
        saveState();
      }
    }

    function isPetEnergetic() {
      const today = new Date().toISOString().split("T")[0];
      return appState.pet.lastActiveDate === today && appState.transactions.length > 0;
    }

    function buyPet(petKey, price) {
      if (appState.pet.points < price) {
        showToast(`Poin tidak cukup! Butuh ${price} poin. Kamu memiliki ${appState.pet.points} poin.`, "error");
        return;
      }
      appState.pet.points -= price;
      if (!appState.pet.unlockedPets.includes(petKey)) {
        appState.pet.unlockedPets.push(petKey);
      }
      appState.pet.type = petKey;
      saveState();
      confetti({ particleCount: 70, spread: 60 });
      showToast(`Berhasil membeli dan memakai Pet ${PET_PRICING[petKey].name}!`, "success");
      renderShopPetsContent();
      document.getElementById("shop-user-points").innerText = appState.pet.points;
      renderApp();
    }

      appState.pet.type = petKey;
      saveState();
      renderShopPetsContent();
      renderApp();
      showToast(`Pet diubah ke ${PET_PRICING[petKey].name}`, "info");
    }

      if (appState.pet.points < price) {

    /* ==========================================================================
       10. REAL GOOGLE GEMINI AI FINANCIAL COACH
       ========================================================================== */
    async function generateRealGeminiAdvice() {
      const responseBox = document.getElementById("ai-response-box");
      const btn = document.getElementById("btn-trigger-ai");
      if (!responseBox) return;

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Gemini AI sedang menganalisis...`;
      responseBox.innerHTML = `<span class="animate-pulse">Menghubungkan ke Google Gemini AI untuk menganalisis data riil keuanganmu...</span>`;

      const metrics = getFinancialMetrics();
      const promptText = `Peranmu adalah Financial Planner berpengalaman. Analisis data riil keuangan pengguna ini: Pemasukan Total: Rp ${metrics.totalIncome}, Pengeluaran Total: Rp ${metrics.totalExpense}, Saldo Bersih: Rp ${metrics.currentBalance}, Tingkat Tabungan (Savings Rate): ${metrics.savingsRate}%. Rincian Pengeluaran: ${JSON.stringify(metrics.expenseByCategory)}.
Berikan feedback terstruktur dalam 3 poin ringkas:
1. Evaluasi kesehatan anggaran
2. Saran efisiensi & pencegahan kebocoran dana
3. Rekomendasi langkah menabung bulan ini
Gunakan bahasa Indonesia yang santai, edukatif, dan menyemangati, maksimal 100 kata.`;

      const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`;
      const payload = {
        contents: [{ parts: [{ text: promptText }] }],
        systemInstruction: { parts: [{ text: "Kamu adalah financial planner profesional, cerdas, hemat, dan ramah." }] }
      };

      try {
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error(`API Error Status: ${response.status}`);
        }

        const data = await response.json();
        const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text;
        
        if (aiText) {
          responseBox.innerHTML = `<div class="text-left">${aiText.replace(/\n/g, '<br/>')}</div>`;
        } else {
          throw new Error("Format respons tidak memuat teks.");
        }
      } catch (err) {
        responseBox.innerHTML = `<div class="text-left text-rose-200">Gagal terhubung ke Gemini API (${err.message}). Pastikan koneksi internet stabil.</div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles text-amber-500"></i> Analisis Keuanganku Sekarang`;
      }
    }

    function handleSaveTransaction(e) {
      e.preventDefault();
      const editId = document.getElementById("tx-edit-id").value;
      const amount = Number(document.getElementById("tx-amount").value);
      const wallet = document.getElementById("tx-wallet").value;
      const category = document.getElementById("tx-category").value;
      const date = document.getElementById("tx-date").value;
      const recurring = document.getElementById("tx-recurring").value;
      const note = document.getElementById("tx-note").value || category;

      if (!amount || amount <= 0) {
        showToast("Nominal harus lebih dari 0!", "error");
        return;
      }

      const today = new Date().toISOString().split("T")[0];

      if (editId) {
        // Mode Ubah / Edit Transaksi
        const index = appState.transactions.findIndex(t => t.id === editId);
        if (index !== -1) {
          appState.transactions[index] = {
            ...appState.transactions[index],
            type: currentTxType,
            amount,
            wallet,
            category,
            date,
            recurring,
            note
          };
          syncToSupabase("update", appState.transactions[index]);
          showToast("Transaksi berhasil diperbarui!", "success");
        }
      } else {
        // Mode Tambah Transaksi Baru
        const newTx = {
          id: "tx-" + Date.now(),
          type: currentTxType,
          amount,
          wallet,
          category,
          date: date || today,
          recurring,
          note
        };

        appState.transactions.unshift(newTx);
        syncToSupabase("insert", newTx);

        // Hadiah XP & Poin untuk Gamifikasi Pet (Rajin Mencatat)
        appState.pet.xp += 20;
        appState.pet.points += 15;
        appState.pet.lastActiveDate = today;

        if (appState.pet.xp >= 100) {
          appState.pet.level += 1;
          appState.pet.xp = appState.pet.xp % 100;
          appState.pet.points += 50;
          confetti({ particleCount: 90, spread: 70 });
          showToast(`Level Up! Pet kamu naik ke Level ${appState.pet.level}! +50 Bonus Poin!`, "success");
        } else {
          showToast("Transaksi dicatat! +20 XP & +15 Poin!", "success");
        }

        // Hitung progress Spending Challenge jika pengeluaran
        if (currentTxType === "expense" && amount <= appState.challenge.dailyLimit) {
          if (appState.challenge.daysCompleted < appState.challenge.totalDays) {
            appState.challenge.daysCompleted += 1;
          }
        }
        appState.challenge.streak += 1;
      }

      saveState();
      closeModal("tx-modal");
      renderApp();
    }

    function confirmDeleteTransaction(id) {
      showConfirmModal("Hapus Transaksi", "Apakah kamu yakin ingin menghapus transaksi ini?", () => {
        appState.transactions = appState.transactions.filter(t => t.id !== id);
        syncToSupabase("delete", { id });
        saveState();
        renderApp();
        showToast("Transaksi dihapus.", "info");
      });
    }

    /* ==========================================================================
       12. SINKRONISASI SUPABASE & LAPORAN OTOMATIS
       ========================================================================== */
    async function syncToSupabase(action, record) {
      if (!supabaseClient || !appState.currentUser) return;
      try {
        if (action === "insert") {
          await supabaseClient.from("transactions").insert([{ ...record, user_id: appState.currentUser.username }]);
        } else if (action === "update") {
          await supabaseClient.from("transactions").update(record).eq("id", record.id);
        } else if (action === "delete") {
          await supabaseClient.from("transactions").delete().eq("id", record.id);
        }
      } catch (err) {
        console.warn("Supabase background sync:", err);
      }
    }

      content.innerHTML = `
        <div class="bg-brand-50 p-3 rounded-2xl border border-brand-200 text-slate-700 space-y-1">
          <p class="font-extrabold text-xs text-brand-700">Ringkasan Arus Kas (Cash Flow)</p>
          <div class="flex justify-between"><span>Pemasukan:</span> <b class="text-emerald-600">${formatMoney(metrics.totalIncome)}</b></div>
          <div class="flex justify-between"><span>Pengeluaran:</span> <b class="text-rose-600">${formatMoney(metrics.totalExpense)}</b></div>
          <div class="flex justify-between border-t border-brand-200 pt-1"><span>Tabungan Bersih:</span> <b class="text-brand-700">${formatMoney(metrics.currentBalance)}</b></div>
        </div>

        <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200 text-slate-700 space-y-1">
          <p class="font-extrabold text-xs">Saldo Tiap Dompet / Bank</p>
          ${Object.entries(metrics.walletBalances).length === 0 ? '<p class="text-slate-400">Belum ada data saldo bank.</p>' : 
            Object.entries(metrics.walletBalances).map(([w, b]) => `
              <div class="flex justify-between"><span>${w}:</span> <b>${formatMoney(b)}</b></div>
            `).join('')
          }
        </div>

        <div class="bg-amber-50 p-3 rounded-2xl border border-amber-200 text-amber-900 space-y-1">
          <p class="font-extrabold text-xs">Indikator Kesehatan Finansial</p>
          <div class="flex justify-between"><span>Savings Rate:</span> <b>${metrics.savingsRate}%</b></div>
          <div class="flex justify-between"><span>Burn Rate Bulanan:</span> <b>${formatMoney(metrics.totalExpense)}/bln</b></div>
        </div>
      `;

      openModal("reports-modal");
    }

    /* ==========================================================================
       13. AUTH & PENGATURAN LAINNYA
       ========================================================================== */
    function setAuthTab(tab) {
      authTab = tab;
      renderApp();
    }

    function handleAuthSubmit(e) {
      e.preventDefault();
      const usernameInput = document.getElementById("auth-username").value.trim();

      if (authTab === "forgot") {
        const newPass = document.getElementById("auth-new-password").value;
        const userFound = appState.accounts.find(a => a.username.toLowerCase() === usernameInput.toLowerCase());
        
        if (userFound) {
          userFound.password = newPass;
          saveState();
          showToast("Kata sandi berhasil direset! Silakan masuk.", "success");
          setAuthTab("login");
        } else {
          appState.accounts.push({ username: usernameInput, password: newPass });
          saveState();
          showToast("Username dipulihkan dan kata sandi baru disimpan!", "success");
          setAuthTab("login");
        }
        return;
      }

      const passwordInput = document.getElementById("auth-password").value;

      if (authTab === "register") {
        const exists = appState.accounts.some(a => a.username.toLowerCase() === usernameInput.toLowerCase());
        if (exists) {
          showToast("Username sudah digunakan!", "error");
          return;
        }
        const newUser = { username: usernameInput, password: passwordInput };
        appState.accounts.push(newUser);
        appState.currentUser = newUser;
        appState.currentView = "dashboard";
        saveState();
        renderApp();
        confetti({ particleCount: 70, spread: 60 });
        showToast(`Selamat datang, ${usernameInput}! Akun berhasil dibuat.`, "success");
      } else {
        const matched = appState.accounts.find(a => a.username.toLowerCase() === usernameInput.toLowerCase() && a.password === passwordInput);
        if (matched) {
          appState.currentUser = { username: usernameInput };
          appState.currentView = "dashboard";
          saveState();
          renderApp();
          showToast(`Selamat datang kembali, ${usernameInput}!`, "success");
        } else {
          showToast("Username atau kata sandi salah!", "error");
        }
      }
    }

    function handleLogout() {
      appState.currentUser = null;
      appState.currentView = "auth";
      saveState();
      renderApp();
      showToast("Berhasil keluar akun.", "info");
    }

    function confirmDeleteAccount() {
      showConfirmModal("Hapus Akun & Data (GDPR)", "Tindakan ini permanen. Semua data akun dan transaksi akan dihapus dari perangkat dan database.", () => {
        localStorage.removeItem(STORAGE_KEY);
        appState = { ...defaultState, currentUser: null, currentView: "onboarding" };
        saveState();
        renderApp();
        showToast("Semua data akun kamu telah dihapus.", "info");
      });
    }

    function handleSaveBudget(e) {
      e.preventDefault();
      const cat = document.getElementById("budget-category").value;
      const limit = Number(document.getElementById("budget-limit").value);
      appState.budgets[cat] = limit;
      saveState();
      closeModal("budget-modal");
      renderApp();
      showToast("Batas anggaran diperbarui!", "success");
    }

    function handleSaveDream(e) {
      e.preventDefault();
      const name = document.getElementById("dream-name").value;
      const target = Number(document.getElementById("dream-target").value);
      const saved = Number(document.getElementById("dream-saved").value) || 0;
      const deadline = document.getElementById("dream-date").value;

      appState.dreams.push({ id: "d-" + Date.now(), name, target, saved, deadline });
      saveState();
      closeModal("dream-modal");
      renderApp();
      showToast("Target impian berhasil ditambahkan!", "success");
    }

    /* ==========================================================================
       14. EKSPOR DATA & HYBRID PWA
       ========================================================================== */
    function exportToCSV() {
      let csv = "data:text/csv;charset=utf-8,ID,Tipe,Nominal,Kategori,Dompet/Bank,Tanggal,Catatan\n";
      appState.transactions.forEach(t => {
        csv += `${t.id},${t.type},${t.amount},"${t.category}","${t.wallet}",${t.date},"${t.note}"\n`;
      });
      const encodedUri = encodeURI(csv);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `Keuanganku_Transaksi_${new Date().toISOString().split("T")[0]}.csv`);
      document.body.appendChild(link);
      link.click();
      link.remove();
      showToast("Data diekspor ke CSV!", "success");
    }

    function exportToJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState.transactions, null, 2));
      const anchor = document.createElement("a");
      anchor.setAttribute("href", dataStr);
      anchor.setAttribute("download", `Keuanganku_Data_${Date.now()}.json`);
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      showToast("Data diekspor ke JSON!", "success");
    }

    let deferredPrompt = null;
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const banner = document.getElementById("pwa-banner");
      if (banner) banner.classList.remove("hidden");
    });

    function installHybridApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          dismissPWABanner();
          deferredPrompt = null;
        });
      } else {
        showToast("Gunakan opsi 'Add to Home Screen' di browser ponsel untuk memasang.", "info");
        dismissPWABanner();
      }
    }

    function dismissPWABanner() {
      const banner = document.getElementById("pwa-banner");
      if (banner) banner.classList.add("hidden");
    }

    function goToAuth() {
      appState.currentView = "auth";
      renderApp();
    }

    function switchTab(viewName) {
      appState.currentView = viewName;
      renderApp();
    }

    function updateNavHighlight(activeTab) {
      document.querySelectorAll(".nav-btn").forEach(btn => {
        if (btn.getAttribute("data-tab") === activeTab) {
          btn.classList.add("text-brand-500");
          btn.classList.remove("text-slate-400");
        } else {
          btn.classList.remove("text-brand-500");
          btn.classList.add("text-slate-400");
        }
      });
    }

    function togglePrivacyMode() {
      appState.hideNominal = !appState.hideNominal;
      saveState();
      renderApp();
      showToast(appState.hideNominal ? "Nominal disembunyikan." : "Nominal ditampilkan.", "info");
    }

    function changeCurrency(curr) {
      appState.activeCurrency = curr;
      saveState();
      renderApp();
      showToast(`Mata uang diubah ke ${curr}`, "info");
    }

    function toggleLanguage() {
      appState.lang = appState.lang === "id" ? "en" : "id";
      saveState();
      renderApp();
    }

    function openModal(id) {
      const el = document.getElementById(id);
      if (el) el.classList.remove("hidden");
    }

    function closeModal(id) {
      const el = document.getElementById(id);
      if (el) el.classList.add("hidden");
    }

    window.addEventListener("DOMContentLoaded", () => {
      evaluatePetActivity();
      renderApp();
    });
  </script>
</body>
</html>
